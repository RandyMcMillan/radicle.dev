# Dependencies parsed from https://crates.io/search?q=radicle (110 crates).
# 10 of them cannot coexist with the versions below and are listed, commented
# out, at the end of this section with the reason they were excluded.
# Excluded from the search results because they conflict with the crates
# above. Uncommenting any of them breaks `cargo generate-lockfile`.
# radicle-ed25519-compact = "2.0.3" # only published version is yanked
# radicle-uri = "0.1.3"              # pins cyphergraphy =0.3.0, radicle needs ^0.3.1
# rad-uri = "0.4.1"                  # depends on radicle-uri 0.1.0 (same conflict)
# radicle-backup = "0.4.1"           # sqlite3-src links sqlite3, clashes with radicle
# radicle-keystore = "0.2.0"         # chacha20poly1305 =0.9.0 needs zeroize <1.5
# gitorii = "0.16.1"                 # needs an older clap than the one selected
# radicle-httpd = "0.10.0"           # needs an older cc than the one selected
# git-commit = "0.3.0"               # libgit2-sys links git2, clashes with radicle
# radicle-feed = "0.5.3"             # libgit2-sys links git2, clashes with radicle
# radicle-tui = "0.7.0"              # libgit2-sys links git2, clashes with radicle
# radicle-native-ci = "0.14.0"       # pulls radicle 0.22 -> radicle-crypto 0.16,
#                                    # which does not compile against cyphergraphy 0.3.1
# radicle-ci-adapter = "0.1.1"
# radicle-ci-ambient = "0.23.0"
# radicle-ci-broker = "0.32.1"
# radicle-job = "0.6.0"
# radicle-source = "0.4.0"          # pulls radicle-surf 0.8, which does not
#                                    # compile against git2 0.21

[target.'cfg(target_os = "linux")'.dependencies]
# syd >= 3.24 pulls in hardened-malloc (needs glibc headers); 3.24-3.59 are all
# yanked and older versions need the yanked mimalloc2-rust. Linux only.
# The rcp-tools family depends on `procfs`, which only builds on Linux.
rcp-tools-common = "0.40.0"
rcp-tools-filegen = "0.40.0"
rcp-tools-rchm = "0.40.0"
rcp-tools-rcmp = "0.40.0"
rcp-tools-rcp = "0.40.0"
rcp-tools-remote = "0.40.0"
rcp-tools-rlink = "0.40.0"
rcp-tools-rrm = "0.40.0"
syd = "3.59.0"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"

# repos-manager
[profile.release]
lto = true
codegen-units = 1
strip = true
