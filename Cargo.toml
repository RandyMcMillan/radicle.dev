radicle-oid = "0.2.2"
radicle-protocol = "0.9.1"
radicle-registry-client = "0.0.0"
radicle-registry-node = "0.0.0"
radicle-registry-runtime = "0.0.0"
radicle-remote-helper = "0.18.1"
radicle-schemars = "0.9.1"
radicle-signals = "0.12.1"
radicle-ssh = "0.10.0"
radicle-std-ext = "0.2.0"
radicle-surf = "0.29.0"
radicle-systemd = "0.13.0"
radicle-term = "0.19.1"
radicle-windows = "0.1.0"
