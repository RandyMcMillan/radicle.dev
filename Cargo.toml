[package]
name = "radicle-dev"
version = "0.1.0"
edition = "2024"

[dependencies]

# repos-manager
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
dirs = "7.0.0"
flate2 = "1.1.10"
glob = "0.3.4"
rpassword = "7.5.4"
self-replace = "1.5.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
tar = "0.4.46"
unicode-normalization = "0.1.25"
ureq = { version = "3.4.2", features = ["json"] }
walkdir = "2.5.0"
which = "8.0.6"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Dependencies parsed from https://crates.io/search?q=radicle by
