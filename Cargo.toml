rad2 = "0.0.0"
radicle = "0.25.1"
radicle-artifact = "0.23.1"
radicle-artifact-client = "0.23.1"
radicle-artifact-core = "0.23.1"
radicle-artifact-node = "0.23.1"
radicle-cli = "0.23.0"
radicle-cli-test = "0.14.1"
radicle-cob = "0.21.1"
radicle-core = "0.4.1"
radicle-crypto = "0.19.0"
radicle-dag = "0.10.0"
radicle-fetch = "0.21.1"
radicle-git-ext = "0.13.0"
radicle-git-metadata = "0.2.1"
radicle-git-ref-format = "0.2.0"
radicle-localtime = "0.1.0"
radicle-log = "0.2.0"
