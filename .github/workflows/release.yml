# Publishes the releases of gnostr-dev.
#
# A `v*` tag builds one archive per target and attaches it to the release,
# under the name the self-updater looks for: gnostr-dev-<target>. The
# checksums the updater verifies the archive against are published next to
# them, as SHA256SUMS.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags, to find the highest version below

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi

      # A release that already exists for this tag (a re-run, or a tag pushed
      # again after a fix) is replaced. The tag itself is kept.
      - name: Create the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, replacing it"
            gh release delete "$TAG" --yes
          fi
          # Only the highest version is marked "latest", which is what
          # releases/latest (the self-updater) resolves to. Without this, an
          # older tag rebuilt later would take over. The candidates are the
          # releases of this repository: the tags it inherited from the
          # upstream history belong to another project, with a version line
          # of their own.
          highest=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | sort -V | tail -1)
          latest=false
          [ "$highest" = "$TAG" ] && latest=true
          echo "Highest release is $highest, latest=$latest"
          gh release create "$TAG" --generate-notes --verify-tag --latest="$latest"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin,        os: macos-latest }
          - { target: aarch64-apple-darwin,       os: macos-latest }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest }
          - { target: aarch64-pc-windows-msvc,    os: windows-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The archive holds the binary under its own name, which is what the
      # self-updater looks for inside it.
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp LICENSE readme.md target/${{ matrix.target }}/release/gnostr-dev dist/
          tar -czf gnostr-dev-${{ matrix.target }}.tar.gz -C dist LICENSE readme.md gnostr-dev

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          cp LICENSE readme.md target/${{ matrix.target }}/release/gnostr-dev.exe dist/
          (cd dist && 7z a ../gnostr-dev-${{ matrix.target }}.zip LICENSE readme.md gnostr-dev.exe)

      - name: Upload
        run: |
          shopt -s nullglob
          gh release upload "$TAG" --clobber gnostr-dev-*.tar.gz gnostr-dev-*.zip

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Hash the archives
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'gnostr-dev-*'
          sha256sum gnostr-dev-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber SHA256SUMS
